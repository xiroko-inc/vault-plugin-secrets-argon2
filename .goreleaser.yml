version: 2

project_name: vault-plugin-secrets-argon2

before:
  hooks:
    - go mod tidy

builds:
  - id: vault-plugin-secrets-argon2
    main: ./cmd/vault-plugin-secrets-argon2
    binary: vault-plugin-secrets-argon2
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Stamp the tag verbatim (e.g. "v0.1.3") rather than goreleaser's
      # default `.Version` (which strips the leading `v`). Vault 1.21+
      # normalizes plugin catalog versions to the canonical
      # `vX.Y.Z` form during `vault secrets enable -plugin-version=...`
      # lookups; a binary that reports `0.1.3` (no `v`) gets registered
      # under that string but lookups normalize to `v0.1.3` and 404 the
      # catalog. Using `{{.Tag}}` keeps the binary's RunningVersion
      # aligned with Vault's expectation. See
      # vault-plugin-secrets-argon2 issue (and consuming-project fallout)
      # in xiroko-inc/doro PR #81 follow-up debugging.
      - -s -w -X main.version={{.Tag}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc

release:
  github:
    owner: xiroko-inc
    name: vault-plugin-secrets-argon2
  draft: false
  prerelease: auto
