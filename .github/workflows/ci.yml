name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build -trimpath ./...

      - name: go test (race + short)
        run: go test -race -short ./...

      # Acceptance tests build the plugin binary and run it under a
      # real `vault server -dev` subprocess. Install the official
      # release binary directly — there is no first-party
      # hashicorp/setup-vault action; community alternatives are
      # avoided here in favor of a pinned upstream-release download.
      - name: Install vault binary
        env:
          VAULT_VERSION: 1.21.4
        run: |
          set -euo pipefail
          arch=$(dpkg --print-architecture)
          curl -fsSL -o /tmp/vault.zip \
            "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_${arch}.zip"
          sudo unzip -d /usr/local/bin /tmp/vault.zip
          sudo chmod +x /usr/local/bin/vault
          vault --version

      - name: go test (acceptance, real vault subprocess)
        run: go test -tags acceptance -race -timeout 5m ./...
