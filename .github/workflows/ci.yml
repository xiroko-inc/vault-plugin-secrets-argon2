name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build -trimpath ./...

      - name: go test (race + short)
        run: go test -race -short ./...

      # Acceptance tests build the plugin binary and run it under a
      # real `vault server -dev` subprocess. Requires the vault CLI.
      - name: Install vault binary
        uses: hashicorp/setup-vault@v1
        with:
          version: 1.21.4

      - name: go test (acceptance, real vault subprocess)
        run: go test -tags acceptance -race -timeout 5m ./...
