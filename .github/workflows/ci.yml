name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # Build + unit tests — delegated to the org-default reusable Go CI
  # (go build + go test --short -race). Go version is read from go.mod
  # (single source of truth). See xiroko-inc/.github for the reusable.
  ci:
    uses: xiroko-inc/.github/.github/workflows/ci-go.yml@main
    secrets: inherit
    with:
      go-version-file: go.mod
      working-directory: .

  # Acceptance tests are repo-specific coverage the reusable does not
  # carry — they build the plugin binary and run it under a real
  # `vault server -dev` subprocess (`-tags acceptance`). Kept local so
  # the reusable-CI migration doesn't drop this gate. Install the pinned
  # release archive from releases.hashicorp.com and verify the SHA-256
  # against the published SHA256SUMS file before extraction —
  # supply-chain defense in depth, since this downloads + executes a
  # third-party binary on every PR. There is no first-party
  # hashicorp/setup-vault action; a community action would only shift
  # the supply-chain surface to the action's tag.
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install vault binary
        env:
          VAULT_VERSION: 1.21.4
        run: |
          set -euo pipefail
          arch=$(dpkg --print-architecture)
          base="https://releases.hashicorp.com/vault/${VAULT_VERSION}"
          archive="vault_${VAULT_VERSION}_linux_${arch}.zip"
          curl -fsSL -o "/tmp/${archive}" "${base}/${archive}"
          curl -fsSL -o /tmp/vault_SHA256SUMS "${base}/vault_${VAULT_VERSION}_SHA256SUMS"
          # SHA256SUMS lists every-arch checksums; grep our archive's line
          # and verify with sha256sum --check.
          grep " ${archive}$" /tmp/vault_SHA256SUMS > /tmp/vault.sha256
          (cd /tmp && sha256sum --check vault.sha256)
          # Extract to a scratch dir so we don't collide with any
          # existing /usr/local/bin/LICENSE.txt the runner image
          # already ships, then install just the vault binary.
          mkdir -p /tmp/vault-install
          unzip -o -d /tmp/vault-install "/tmp/${archive}"
          sudo install -m 0755 /tmp/vault-install/vault /usr/local/bin/vault
          vault --version

      - name: go test (acceptance, real vault subprocess)
        run: go test -tags acceptance -race -timeout 5m ./...
