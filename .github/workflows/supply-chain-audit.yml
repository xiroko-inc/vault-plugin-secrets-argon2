name: supply-chain-audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Blocking, reachability-based vuln gate — delegated to the org-default
  # reusable (govulncheck). See xiroko-inc/.github.
  audit:
    uses: xiroko-inc/.github/.github/workflows/supply-chain-audit-go.yml@main
    secrets: inherit
    with:
      go-version-file: go.mod
      working-directory: .

  # Advisory dependency-age check (warn-only): flags any module published in
  # the last 3 days to blunt early-adopter supply-chain attacks. The reusable
  # is govulncheck-only, so this stays local to avoid a coverage regression
  # (per ~/.claude/standards/github-actions.md).
  dependency-age:
    # Pinned to match the reusables' runner (they default runs-on: ubuntu-24.04)
    # and the platform's immutable-pin preference — not floating ubuntu-latest.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `go list -m -u -json all` emits a sequence of full JSON objects (NOT a
      # JSON array, NOT newline-delimited). check-mod-age.py walks the stream
      # with JSONDecoder.raw_decode; naive line splitting fails because nested
      # objects (Update, Replace, Origin) contain interior `}` lines.
      - name: Inspect module graph for newly-published versions
        run: |
          go list -m -u -json all > /tmp/modgraph.json
          python3 scripts/check-mod-age.py --max-days 3 --warn-only /tmp/modgraph.json
        env:
          # `set -e` is fine here; the prior `pipefail` form was tripped by
          # SIGPIPE from `go list` when python finished reading early. With the
          # temp file there is no pipe.
          PYTHONUNBUFFERED: "1"
