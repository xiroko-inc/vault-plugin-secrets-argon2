name: static-checks

# Thin caller for the org-default reusable Go static-checks workflow
# (go vet + gofmt auto-fix + golangci-lint from source). See xiroko-inc/.github.
on:
  pull_request:
    branches: ["main"]

jobs:
  static:
    # The reusable pushes gofmt fixes back to the PR branch; a reusable
    # workflow's token is capped by the caller and can't elevate, so grant
    # write here or the push 403s. See xiroko-inc/.github README.
    permissions:
      contents: write
      pull-requests: write
    uses: xiroko-inc/.github/.github/workflows/static-checks-go.yml@main
    secrets: inherit
    with:
      go-version-file: go.mod
      working-directory: .
