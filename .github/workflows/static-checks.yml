name: static-checks

on:
  pull_request:
    branches: ["main"]

permissions:
  # contents: write is required by the conditional gofmt auto-push
  # step. This is the global ~/.claude/standards/github-actions.md
  # template pattern: developers are never blocked by whitespace.
  # Splitting the auto-push into a separate push-event workflow is a
  # defensible follow-up but not a v0.1.0 blocker — pull_request
  # events do not expose write tokens to forked-PR contributors.
  contents: write

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # An inline `//` comment on the `go` directive hides it from Renovate
      # completely (its regex is end-anchored), so the repo silently stops
      # receiving Go toolchain updates — which is where the stdlib security
      # patch level lives. This repo was in that state, which is why the
      # 1.26.5 -> 1.26.7 bump had to be made by hand. (Which advisory each
      # release actually fixed is recorded in go.mod, not restated here.)
      # See xiroko-inc/.github#25.
      #
      # The checker is a VENDORED VERBATIM COPY, not a reference. This repo is
      # public, so it cannot call the private xiroko-inc/.github reusable
      # workflow, and a fork must get working CI with nothing privileged — a
      # reference would break by construction. The weekly fleet sweep diffs this
      # copy against canonical, so drift fails loudly. When you change one,
      # change both: xiroko-inc/.github/go-directive-vendored.json is the list.
      #
      # Before setup-go deliberately: it needs no toolchain, no network and no
      # module download, so a hidden directive is reported in seconds rather
      # than after a full dependency fetch.
      - name: Assert the go directive is visible to Renovate
        run: python3 scripts/check_go_directive.py go.mod

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        id: gofmt
        run: |
          gofmt -s -w .
          if git diff-index --quiet HEAD --; then
            echo "modified=false" >> $GITHUB_OUTPUT
          else
            echo "modified=true" >> $GITHUB_OUTPUT
          fi

      - name: Push gofmt fixes
        if: steps.gofmt.outputs.modified == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: gofmt"
          git push

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # install-mode: goinstall COMPILES golangci-lint from source under
          # the runner's Go (whatever go.mod's directive names, via
          # go-version-file above) instead of pulling a prebuilt binary. No
          # version restated here: this comment said 1.26.3 through two bumps.
          # This is load-bearing:
          # golangci-lint's released binaries are built with latest-minus-1
          # (its own go.mod: "minimum Go version must always be latest-1"),
          # and the linter REFUSES any module whose targeted Go exceeds its
          # build version. With our go.mod now on `go 1.26.3`, no prebuilt
          # golangci-lint accepts it — but a source build under 1.26.3 has
          # build-Go == target, so it lints clean. Cost: ~1-2 min to compile
          # the linter each run. Revert to a pinned binary (version: vX.Y)
          # once a golangci-lint release built on Go 1.26 ships.
          # See decisions/2026-06-01-go-1-26-3-lint-from-source.md
          install-mode: goinstall
          version: latest

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
